# 한 번에 띄우기: docker compose up -d --build   → 화면 http://localhost:5173
#   처음 뜰 때 db_init이 스키마·시드를 넣는다 (DB에 이미 있으면 그대로 둔다). 처음부터 다시: docker compose down -v
#   Slack 봇까지:         docker compose --profile slack up -d
#   외부 공개(Cloudflare): docker compose --profile slack --profile public up -d   (.env: APP_ENV=prod, JWT_SECRET, CF_ACCOUNT_ID, CF_API_TOKEN)
# 설정은 .env (없으면 .env.example 값). 컨테이너끼리 주소(…_URL)는 아래 environment가 .env보다 우선한다.
x-app: &app
  build: .
  image: mcp-capstone-app
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

x-urls: &urls
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-capstone}:${POSTGRES_PASSWORD:-capstone}@postgres:5432/${POSTGRES_DB:-capstone}
  BACKEND_URL: http://backend:8000
  AGENT_URL: http://agent:8002
  MCP_WORK_URL: http://mcp_work:8010/mcp
  MCP_DOCS_URL: http://mcp_docs:8011/mcp
  WEB_URL: ${WEB_URL:-http://localhost:5173}

x-port-check: &port-check  # 서비스가 포트를 열었는지만 본다 (인증 없는 경로가 서비스마다 달라서)
  interval: 5s
  timeout: 3s
  retries: 30

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone}
      POSTGRES_DB: ${POSTGRES_DB:-capstone}
    ports:
      - "127.0.0.1:5432:5432"   # DBeaver·테스트 접속용. 로컬에서만 열린다
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-capstone}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  db_init:  # 한 번 실행하고 끝난다. 스키마가 없을 때만 스키마·시드를 넣는다
    <<: *app
    restart: "no"
    command: ["scripts/docker/init_db.sh"]
    environment:
      <<: *urls
      APP_ENV: dev  # 시드(seed_team)는 프로세스 안에서 개발 토큰을 쓴다. 외부에 열리는 포트가 없다
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    <<: *app
    command: ["uvicorn", "apps.backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "3"]
    environment: *urls
    ports:
      - "127.0.0.1:8000:8000"   # API 문서 http://localhost:8000/docs
    healthcheck:
      <<: *port-check
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
    depends_on:
      db_init: { condition: service_completed_successfully }

  mcp_work:
    <<: *app
    command: ["python", "-m", "apps.mcp_work.server"]
    environment: *urls
    ports:
      - "127.0.0.1:8010:8010"   # MCP Inspector 접속용
    healthcheck:
      <<: *port-check
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8010), 2)"]
    depends_on:
      backend: { condition: service_healthy }

  mcp_docs:
    <<: *app
    command: ["python", "-m", "apps.mcp_docs.server"]
    environment: *urls
    ports:
      - "127.0.0.1:8011:8011"
    healthcheck:
      <<: *port-check
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8011), 2)"]
    depends_on:
      backend: { condition: service_healthy }

  agent:
    <<: *app
    command: ["uvicorn", "apps.agent_runtime.main:app", "--host", "0.0.0.0", "--port", "8002", "--timeout-graceful-shutdown", "3"]
    environment: *urls
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      <<: *port-check
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8002), 2)"]
    depends_on:
      mcp_work: { condition: service_healthy }
      mcp_docs: { condition: service_healthy }

  admin_web:  # Vue 빌드 + nginx. /api/* 는 backend로 (AI 비서도 backend가 agent로 중계)
    build: ./apps/admin_web
    image: mcp-capstone-web
    ports:
      - "5173:80"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  slack_bot:  # .env에 SLACK_BOT_TOKEN·SLACK_APP_TOKEN이 있어야 한다. 같은 토큰으로 봇은 한 대만 띄운다
    <<: *app
    profiles: ["slack"]
    command: ["python", "-m", "apps.slack_bot"]
    environment: *urls
    depends_on:
      agent: { condition: service_healthy }

  tunnel:  # Cloudflare Quick Tunnel → admin_web. 주소는 켤 때마다 바뀌고 tunnel_kv가 고정 주소에 연결한다
    image: cloudflare/cloudflared:2025.9.0
    profiles: ["public"]
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://admin_web:80"]
    depends_on:
      - admin_web
    restart: unless-stopped

  tunnel_kv:
    <<: *app
    profiles: ["public"]
    entrypoint: ["python", "scripts/docker/tunnel_kv.py"]  # DB가 필요 없어 시스템 토큰 발급(entrypoint.sh)을 건너뛴다
    command: []
    depends_on:
      - tunnel

volumes:
  pgdata:
