# 지금은 postgres만. 나머지 서비스는 docs/아키텍처.md 9절 순서대로 추가한다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone}
      POSTGRES_DB: ${POSTGRES_DB:-capstone}
    ports:
      - "127.0.0.1:5432:5432"   # DBeaver 접속용. 로컬에서만 열린다
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-capstone}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
