[project]
name = "ai-agent-capstone"
version = "0.1.0"
description = "기업 AI 활용·운영 최적화 에이전트 (MVP)"
requires-python = ">=3.12"
dependencies = [
    # 공통
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # 에이전트 (LangGraph)
    "langgraph>=1.2",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.7",
    "langgraph-checkpoint-postgres>=3.0",
    # MCP 서버·클라이언트 (mcp 2.x). langchain-mcp-adapters는 mcp 1.x 전용이라 쓰지 않는다
    "fastmcp>=4.1,<5",
    # 접점
    "requests>=2.32",
    "slack-bolt>=1.20",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]   # pip 사용자용: pip install -e ".[dev]"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]   # uv sync 가 기본으로 설치

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/schemas"]
include = ["schemas*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
