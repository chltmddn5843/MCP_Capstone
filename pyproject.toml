[project]
name = "ai-agent-capstone"
version = "0.1.0"
description = "기업 AI 활용·운영 최적화 에이전트 (MVP)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
agent = [
    "langgraph>=1.2",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.7",
    "langchain-mcp-adapters>=0.3",
    "langgraph-checkpoint-sqlite>=3.1",
    "python-dotenv>=1.0",
]
mcp = ["mcp>=1.2"]
slack = ["slack-bolt>=1.20"]
ui = ["streamlit>=1.38", "requests>=2.32"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/schemas"]
include = ["schemas*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
